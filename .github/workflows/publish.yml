name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check package and release versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release.py

  verify:
    needs: version
    uses: ./.github/workflows/verify.yml
    with:
      release-tag: ${{ github.event.release.tag_name || '' }}

  publish:
    name: Publish verified distributions
    needs: verify
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Matches the PyPI Trusted Publisher with Environment name left blank.
    permissions:
      id-token: write
    steps:
      - name: Download tested Ubuntu Python 3.12 distributions
        uses: actions/download-artifact@v6
        with:
          name: distributions-ubuntu-latest-py3.12
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
